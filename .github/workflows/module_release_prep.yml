# This is a generic workflow for creating a release prep
# pr for a puppet module.
# It requires that the caller sets `secrets: inherit` to ensure
# that secrets are visible from steps in this workflow.
name: "Module Release Prep"

on:
  workflow_call:
    inputs:
      version:
        description: "Module version to be released."
        required: true
        type: "string"
      ruby_version:
        description: "Ruby version to use"
        required: false
        default: "3.2"
        type: "string"


jobs:
  release_prep:
    name: "Release prep"
    runs-on: "ubuntu-latest"

    env:
      BUNDLE_WITHOUT: development:system_tests

    steps:

      - name: "Checkout"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: "Generate changelog"
        run: |
          export GH_HOST=github.com
          gh extension install chelnak/gh-changelog
          gh changelog new --next-version "v${VERSION#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}

      # gh-changelog regenerates the whole file from all closed PRs and tags, which
      # rewrites and backfills sections of versions that were already released.
      # Keep the generated preamble and newest section, and append the sections
      # of previously released versions from the committed CHANGELOG.md. The step
      # fails when the version is not a valid version (optional pre-release and
      # build suffixes), when the generated file is unusable or its newest section
      # is not the requested version, or when the committed file has headings that
      # cannot be restored, which would lose history.
      - name: "Preserve changelog history"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Reject anything but a version with optional pre-release and build
          # suffixes, which also keeps it safe to use in the sed expression of
          # the "Update metadata.json" step
          if [[ "$VERSION" == *$'\n'* ]] || ! [[ "$VERSION" =~ ^v?[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version"
            exit 1
          fi
          # The generated file must be usable whatever is committed, because
          # metadata.json is bumped to this version afterwards
          if [ ! -f CHANGELOG.md ] || ! grep -q '^## \[' CHANGELOG.md; then
            echo "::error::Generated CHANGELOG.md is missing or has no version sections"
            exit 1
          fi

          version=${VERSION#v}
          # Version of a "## [vX.Y.Z](url) - date" header, without the "v"
          top_version=$(grep -m1 '^## \[' CHANGELOG.md | sed 's/^## \[v\{0,1\}\([^]]*\)\].*/\1/')
          if [ "$top_version" != "$version" ]; then
            echo "::error::Newest generated section is $top_version, not $version, refusing to prepare a release without its changelog section"
            exit 1
          fi

          # git ls-tree prints nothing when the file is untracked and fails on a real git error
          tracked=$(git ls-tree --name-only HEAD -- CHANGELOG.md)
          if [ -z "$tracked" ]; then
            echo "No committed CHANGELOG.md, nothing to preserve"
            exit 0
          fi
          old=$(mktemp)
          history=$(mktemp)
          merged=$(mktemp)
          trap 'rm -f "$old" "$history" "$merged"' EXIT
          git show "HEAD:./CHANGELOG.md" > "$old"

          if ! grep -q '^## ' "$old"; then
            # Nothing to restore when the file is at most a bare title. Any other
            # heading is history in a style that cannot be restored, so stop.
            headings=$(grep -Ec '^#{1,6}([[:space:]]|$)' "$old" || true)
            titles=$(grep -Eic '^#[[:space:]]+(change ?log|changes|release notes|history)[[:space:]]*$' "$old" || true)
            if [ "$headings" -gt "$titles" ] || [ "$headings" -gt 1 ]; then
              echo "::error::Committed CHANGELOG.md has headings but no '## ' sections, refusing to drop its history"
              exit 1
            fi
            echo "::warning::Committed CHANGELOG.md has no '## ' sections, leaving generated CHANGELOG.md as is"
            exit 0
          fi
          # Generated preamble and newest section
          awk '/^## \[/ { n++ } n < 2' CHANGELOG.md > "$merged"

          # Committed sections, minus the one for the version being prepared (a
          # re-run replaces it) and any "Unreleased" section. A section starts at
          # any "## " header, e.g. "## [v1.2.3](url)" or "## v1.2.3". Text before
          # the first section is dropped.
          PREP_VERSION="$version" awk '
            /^## / {
              v = $0
              sub(/^## \[?[vV]?/, "", v)
              sub(/\].*/, "", v)
              sub(/[ \t\r].*/, "", v)
              sub(/[:,;]+$/, "", v)
              keep = (v != ENVIRON["PREP_VERSION"] && tolower(v) != "unreleased")
            }
            keep
          ' "$old" > "$history"

          if grep -Eiq '^## \[?v?unreleased([][:space:]:,;]|$)' "$old"; then
            echo "::warning::Dropping the committed Unreleased section"
          fi

          if [ -s "$history" ]; then
            # Ensure a blank line separates the new section from the restored
            # history, using the line ending of the file
            if [ -n "$(tail -n 1 "$merged" | tr -d '\r')" ]; then
              if head -n 1 "$merged" | grep -q "$(printf '\r')"; then
                printf '\r\n' >> "$merged"
              else
                echo >> "$merged"
              fi
            fi
            cat "$history" >> "$merged"
          fi
          cp "$merged" CHANGELOG.md

      - name: "Update metadata.json"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          current_version=$(jq --raw-output .version metadata.json)
          # Update version in metadata.json, only matching first occurrence
          sed -i "0,/$current_version/s//${VERSION#v}/" $(find . -name 'metadata.json')

      - name: "Configure forge authentication"
        env:
          FORGE_TOKEN: ${{ secrets.PUPPET_FORGE_TOKEN || secrets.PUPPET_FORGE_TOKEN_PUBLIC }}
        run: |
          if [ -n "$FORGE_TOKEN" ]; then
            echo "PUPPET_FORGE_TOKEN=$FORGE_TOKEN" >> $GITHUB_ENV
            echo "BUNDLE_RUBYGEMS___PUPPETCORE__PUPPET__COM=forge-key:$FORGE_TOKEN" >> $GITHUB_ENV
          fi

      - name: "setup ruby"
        uses: "ruby/setup-ruby@v1"
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: "bundle environment"
        run: |
          echo ::group::bundler environment
          bundle env
          echo ::endgroup::

      - name: "Update REFERENCE.md"
        run: |
          bundle exec rake strings:generate:reference

      - name: "Get version"
        id: "get_version"
        run: |
          echo "version=$(jq --raw-output .version metadata.json)" >> $GITHUB_OUTPUT

      - name: "Check if a release is necessary"
        id: "check"
        run: |
          git diff --quiet CHANGELOG.md && echo "release=false" >> $GITHUB_OUTPUT || echo "release=true" >> $GITHUB_OUTPUT

      - name: "Commit changes"
        if: ${{ steps.check.outputs.release == 'true' }}
        run: |
          git config --local user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Release prep v${{ steps.get_version.outputs.version }}"

      - name: "Create pull Request"
        uses: "peter-evans/create-pull-request@v7"
        if: ${{ steps.check.outputs.release == 'true' }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Release prep v${{ steps.get_version.outputs.version }}"
          branch: "release-prep"
          delete-branch: true
          title: "Release prep v${{ steps.get_version.outputs.version }}"
          base: "main"
          body: |
            Automated release-prep through [pdk-templates](https://github.com/puppetlabs/pdk-templates/blob/main/moduleroot/.github/workflows/release_prep.yml.erb) from commit ${{ github.sha }}.
            Please verify before merging:
            - [ ] last [nightly](https://github.com/${{ github.repository }}/actions/workflows/nightly.yml) run is green
            - [ ] [Changelog](https://github.com/${{ github.repository }}/blob/release-prep/CHANGELOG.md) is readable and has no unlabeled pull requests
            - [ ] Ensure the [changelog](https://github.com/${{ github.repository }}/blob/release-prep/CHANGELOG.md) version and [metadata](https://github.com/${{ github.repository }}/blob/release-prep/metadata.json) version match
          labels: "maintenance"
