name: "lint"

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  lint:
    runs-on: "ubuntu-latest"
    steps:

      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Run yaml-lint"
        uses: "ibiqlik/action-yamllint@v3"
        with:
          file_or_dir: ".github/"
          config_file: ".yamllint"

      - name: "Test module_release_prep changelog preservation"
        run: |
          python3 -c 'import yaml' 2> /dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-yaml; }
          bash tests/module_release_prep/test_changelog_guard.sh
